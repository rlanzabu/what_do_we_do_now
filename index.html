<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c0c0c0">
  <title>What Do We Do Now? — Class Archive</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111;
      --muted: #666;
      --desktop: #778b78;
      --blue: #000080;
      --blue-light: #3a6ea5;
      --chrome: #c0c0c0;
      --white: #fff;
      --black: #000;
      --border-light: #fff;
      --border-mid: #dfdfdf;
      --border-dark: #808080;
      --border-xdark: #404040;
      --nav-height: 42px;
      --mono: "Tahoma", "MS Sans Serif", Verdana, sans-serif;
      font-family: var(--mono);
    }

    @font-face {
      font-family: "Dauphine";
      src: url("./assets/fonts/Dauphine%20Regular.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; scroll-behavior: smooth; }

    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--ink);
      background: var(--desktop);
      font: 13px/1.35 var(--mono);
    }

    button { font: inherit; }

    #app {
      position: relative;
      width: 100%;
      height: calc(100dvh - var(--nav-height));
      min-height: 480px;
      overflow: hidden;
      background-color: #111;
      background-image:
        url("./assets/images/cirrus_cloud_white.jpg"),
        linear-gradient(135deg, #26303a, #101116 72%);
      background-position: center center, center;
      background-size: cover, cover;
      background-repeat: no-repeat;
    }

    .desktop {
      position: absolute;
      inset: 0;
      overflow: auto;
      scrollbar-color: #9c9c9c var(--chrome);
    }

    .site-title {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: max-content;
      max-width: calc(100% - 32px);
      margin: 0;
      color: #fff;
      font: 600 clamp(24px, 4vw, 42px)/.95 "Dauphine", var(--mono);
      letter-spacing: 0;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 5px #000, 1px 1px 1px #000;
      transform: translate(-50%, -50%);
    }

    .desktop-node {
      position: absolute;
      display: flex;
      width: 138px;
      min-height: 130px;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: #fff;
      cursor: grab;
      text-align: center;
      text-shadow: 1px 1px 1px #333;
      touch-action: none;
      user-select: none;
    }

    .desktop-node:active { cursor: grabbing; }

    .desktop-node.selected,
    .desktop-node:focus-visible {
      border: 1px dotted #fff;
      background: rgb(0 0 128 / 50%);
      outline: none;
    }

    .desktop-node img {
      display: grid;
      width: var(--png-size, 74px);
      height: var(--png-size, 74px);
      flex: 0 0 var(--png-size, 74px);
      object-fit: contain;
      place-items: center;
      min-width: 0;
      filter: drop-shadow(1px 2px 2px rgb(0 0 0 / 45%));
    }

    .node-label {
      max-width: 126px;
      color: #000;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.2;
      text-shadow: 0 1px 2px rgb(255 255 255 / 90%);
    }

    .node-creator {
      color: #efefef;
      font-size: 10px;
    }

    .context-menu {
      position: fixed;
      z-index: 3100;
      display: flex;
      width: 184px;
      flex-direction: column;
      padding: 3px;
      border: 1px solid var(--border-dark);
      background: var(--chrome);
      box-shadow: inset 1px 1px var(--white), 2px 3px 8px rgb(0 0 0 / 35%);
    }

    .context-menu button {
      padding: 7px 10px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .thumbnail-resize {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 4px 8px;
      padding: 8px 10px 6px;
      border-top: 1px solid var(--border-dark);
      color: var(--ink);
      font-size: 11px;
    }

    .thumbnail-resize input {
      width: 100%;
      grid-column: 1 / -1;
      margin: 2px 0;
      accent-color: var(--blue);
      cursor: ew-resize;
    }

    .context-menu button:hover,
    .context-menu button:focus-visible {
      background: var(--blue);
      color: var(--white);
      outline: none;
    }

    .socials-entry { position: relative; }

    .socials-toggle {
      display: flex;
      width: 100%;
      justify-content: space-between;
    }

    .socials-submenu {
      position: fixed;
      z-index: 1;
      display: none;
      width: min(280px, calc(100vw - 16px));
      max-height: min(320px, calc(100vh - 16px));
      flex-direction: column;
      overflow: auto;
      padding: 3px;
      border: 1px solid var(--border-dark);
      background: var(--chrome);
      box-shadow: inset 1px 1px var(--white), 2px 3px 8px rgb(0 0 0 / 35%);
    }

    .socials-entry.is-open .socials-submenu { display: flex; }

    .socials-link {
      display: block;
      padding: 6px 9px;
      color: var(--ink);
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .socials-link:hover,
    .socials-link:focus-visible {
      background: var(--blue);
      color: var(--white);
      outline: none;
    }

    .socials-empty {
      padding: 7px 9px;
      color: var(--muted);
      font-size: 11px;
    }

    .taskbar {
      position: fixed;
      z-index: 3000;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      height: var(--nav-height);
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 6px;
      border-top: 2px solid var(--white);
      background: var(--chrome);
      box-shadow: inset 0 1px var(--border-mid);
    }

    .taskbar-left {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .task-btn {
      display: inline-flex;
      height: 30px;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border: 0;
      background: var(--chrome);
      color: var(--black);
      cursor: pointer;
      box-shadow:
        inset -1px -1px var(--border-dark),
        inset 1px 1px var(--white),
        inset -2px -2px var(--border-xdark),
        inset 2px 2px var(--border-mid);
    }

    .task-btn:active,
    .task-btn.active {
      box-shadow:
        inset 1px 1px var(--border-dark),
        inset -1px -1px var(--white),
        inset 2px 2px var(--border-xdark),
        inset -2px -2px var(--border-mid);
    }

    .task-icon { width: 17px; font-size: 16px; text-align: center; }
    .task-icon svg { display: block; width: 17px; height: 17px; }

    .taskbar-title {
      overflow: hidden;
      color: #333;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .overlay-backdrop {
      position: fixed;
      z-index: 2000;
      inset: 0 0 var(--nav-height);
      background: rgb(0 0 0 / 16%);
    }

    .overlay-backdrop[hidden],
    .window-shell[hidden] { display: none; }

    .window-shell {
      position: fixed;
      z-index: 2010;
      inset: 0 0 var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      pointer-events: none;
    }

    .window-panel {
      position: relative;
      display: flex;
      width: min(720px, 92vw);
      height: min(76dvh, 680px);
      flex-direction: column;
      background: var(--chrome);
      box-shadow:
        inset 1px 1px var(--white),
        inset -1px -1px var(--border-xdark),
        5px 8px 26px rgb(0 0 0 / 38%);
      pointer-events: auto;
    }

    .window-panel.maximized {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-height: none;
    }

    .titlebar {
      display: flex;
      min-height: 28px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 4px 2px 8px;
      background: var(--blue);
      color: var(--white);
      cursor: move;
      touch-action: none;
    }

    .titlebar-text {
      overflow: hidden;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .titlebar-controls { display: flex; gap: 3px; }

    .window-control {
      display: grid;
      width: 22px;
      height: 21px;
      place-items: center;
      border: 0;
      background: var(--chrome);
      color: var(--black);
      cursor: pointer;
      font-weight: 700;
      line-height: 1;
      box-shadow: inset 1px 1px var(--white), inset -1px -1px var(--border-dark);
    }

    .window-control:active {
      box-shadow: inset 1px 1px var(--border-dark), inset -1px -1px var(--white);
    }

    .window-viewport {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 15px;
      background: var(--white);
      box-shadow:
        inset 1px 1px var(--border-dark),
        inset -1px -1px var(--white);
    }

    .about-content {
      max-width: 610px;
      margin: 8px auto;
      font-size: 14px;
      line-height: 1.55;
    }

    .about-content h2 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .about-content p { margin: 0 0 14px; }

    .questions-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 4px 0 12px;
    }

    .questions-section {
      min-height: 100vh;
      padding: 32px 16px calc(var(--nav-height) + 32px);
      border-top: 2px solid rgb(255 255 255 / 28%);
      background-color: #111;
      background-image:
        url("./assets/images/cirrus_cloud_white.jpg"),
        linear-gradient(135deg, #26303a, #101116 72%);
      background-position: center center, center;
      background-size: cover, cover;
      background-repeat: no-repeat;
      color: #fff;
    }

    .questions-section > h1 {
      max-width: 1000px;
      margin: 0 auto 10px;
      color: #fff;
      font: 600 clamp(24px, 4vw, 42px)/.95 "Dauphine", var(--mono);
      letter-spacing: 0;
      text-align: left;
      text-shadow: 0 2px 5px #000, 1px 1px 1px #000;
    }

    .questions-section > p {
      max-width: 1000px;
      margin: 0 auto 20px;
      color: #000;
      text-shadow: 0 1px 2px rgb(255 255 255 / 70%);
    }

    .questions-intro {
      margin: 0 0 12px;
      color: #000;
      line-height: 1.5;
      text-shadow: 0 1px 2px rgb(255 255 255 / 70%);
    }

    .question-card {
      margin: 0 0 18px;
      padding: 12px;
      border: 1px solid #b8b8b8;
      background: #f0f0f0;
      box-shadow: inset 1px 1px var(--white), 1px 2px 3px rgb(0 0 0 / 12%);
    }

    .question-card h2 {
      margin: 0 0 10px;
      font-size: 15px;
      line-height: 1.4;
    }

    .barometer-pair {
      display: block;
    }

    .barometer-panel {
      min-width: 0;
      border: 1px solid #bfc1c8;
      background: #fff;
    }

    .barometer-panel-title {
      display: block;
      padding: 4px 7px;
      color: #555;
      background: #e7e8ed;
      font-size: 12px;
    }

    .barometer-board {
      position: relative;
      height: 206px;
      overflow: hidden;
      background-color: #fff;
      background-image: linear-gradient(#f5f5f5 1px, transparent 1px), linear-gradient(90deg, #f5f5f5 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .pole-note {
      position: absolute;
      z-index: 1;
      top: 50%;
      display: grid;
      width: 29%;
      min-height: 50px;
      place-items: center;
      padding: 6px;
      border: 1px dotted #c8c2b5;
      background: #f4f1e7;
      color: #252525;
      font-family: Georgia, serif;
      font-size: clamp(9px, 1.15vw, 12px);
      line-height: 1.2;
      text-align: center;
      box-shadow: 2px 3px 4px rgb(0 0 0 / 12%);
      transform: translateY(-50%) rotate(-1deg);
    }

    .pole-note::before {
      position: absolute;
      top: -5px;
      right: -5px;
      left: -5px;
      height: 9px;
      background: rgb(215 190 174 / 60%);
      content: "";
      transform: rotate(-2deg);
    }

    .pole-note.left { left: 7%; }
    .pole-note.right { right: 7%; transform: translateY(-50%) rotate(1deg); }

    .answer-dot {
      position: absolute;
      z-index: 2;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2abb68;
      box-shadow: 0 0 1px rgb(0 0 0 / 20%);
      transform: translate(-50%, -50%);
    }

    .answer-dot.after {
      width: 10px;
      height: 10px;
      background: #e85bc7;
    }

    .barometer-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px 16px;
      min-height: 25px;
      align-items: center;
      padding: 3px 6px;
      color: #555;
      font-size: 10px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2abb68;
    }

    .legend-dot.after { background: #e85bc7; }

    .transition-control {
      display: grid;
      grid-template-columns: auto minmax(60px, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 8px 10px;
      border: 1px solid #bfc1c8;
      background: #e7e8ed;
      color: #444;
      font-size: 11px;
    }

    .transition-slider {
      width: 100%;
      margin: 0;
      accent-color: #9a45b7;
      cursor: ew-resize;
      touch-action: pan-y;
    }

    .transition-reading {
      min-width: 82px;
      color: #333;
      text-align: right;
    }

    @media (max-width: 560px) {
      .barometer-board { height: 190px; }
      .pole-note { font-size: 11px; }
      .transition-control { grid-template-columns: auto minmax(45px, 1fr) auto auto; gap: 5px; padding: 8px 6px; }
      .transition-reading { min-width: 54px; }
    }

    .about-content a,
    .wip-content a {
      color: #00e;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .list-window .window-viewport {
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }

    .list-header,
    .list-row {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(100px, 1fr) minmax(80px, .75fr);
      align-items: center;
      gap: 8px;
    }

    .list-header {
      min-height: 34px;
      padding: 5px 10px;
      border-bottom: 1px solid var(--border-dark);
      background: var(--chrome);
    }

    .sort-button {
      padding: 4px 2px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .sort-button:hover { text-decoration: underline; }

    .list-rows { flex: 1; overflow: auto; }

    .list-row {
      width: 100%;
      min-height: 37px;
      padding: 6px 10px;
      border: 0;
      border-bottom: 1px solid #e6e6e6;
      background: var(--white);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .list-row:hover,
    .list-row:focus-visible {
      background: #e5eefc;
      outline: none;
    }

    .list-row span:not(:first-child) { color: var(--muted); }

    .wip-content {
      max-width: 520px;
      margin: 18px auto;
      font-size: 14px;
      line-height: 1.5;
    }

    .description-project-link {
      display: inline-block;
      margin: 2px 0 16px;
      color: #00e;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .description-screenshot {
      margin: 16px 0;
    }

    .description-screenshot img {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 300px;
      margin: 0 auto;
      object-fit: contain;
    }

    .wip-badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 3px 7px;
      border: 1px solid var(--border-dark);
      background: #f0f0f0;
      color: #444;
      font: 11px var(--mono);
      text-transform: uppercase;
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .dialog-actions a,
    .dialog-actions button {
      display: inline-block;
      padding: 6px 12px;
      border: 0;
      background: var(--chrome);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      box-shadow: inset 1px 1px var(--white), inset -1px -1px var(--border-dark);
    }

    @media (max-width: 560px) {
      :root { --nav-height: 48px; }
      .desktop-node { width: 112px; min-height: 116px; }
      .node-label { max-width: 104px; font-size: 11px; }
      .node-creator { font-size: 9px; }
      .taskbar { gap: 4px; padding: 4px; }
      .taskbar-left { gap: 3px; }
      .task-btn { width: 39px; justify-content: center; padding: 3px; }
      .task-btn .task-name { display: none; }
      .taskbar-title { max-width: 130px; font-size: 10px; }
      .window-shell { padding: 7px; }
      .window-panel { width: 100%; height: 80dvh; }
      .window-panel.maximized { inset: 0; }
      .window-viewport { padding: 11px; }
      .list-header, .list-row {
        grid-template-columns: minmax(0, 1.6fr) minmax(80px, 1fr);
      }
      .list-header .session,
      .list-row .session { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main id="app">
    <section id="desktop" class="desktop" aria-label="Project desktop"></section>
    <h1 class="site-title">What Do We Do Now?</h1>
    <div id="overlay-backdrop" class="overlay-backdrop" hidden></div>
    <section id="window-shell" class="window-shell" aria-label="Archive window" hidden>
      <div id="window-panel" class="window-panel" role="dialog" aria-modal="true" aria-labelledby="window-title">
        <div id="titlebar" class="titlebar">
          <span id="window-title" class="titlebar-text">Window</span>
          <div class="titlebar-controls">
            <button id="maximize-window" class="window-control" type="button" aria-label="Maximize window">□</button>
            <button id="close-window" class="window-control" type="button" aria-label="Close window">×</button>
          </div>
        </div>
        <div id="window-viewport" class="window-viewport"></div>
      </div>
    </section>
  </main>

  <section id="questions-section" class="questions-section" aria-labelledby="questions-heading">
    <h1 id="questions-heading">Questions from the class</h1>
    <p>Explore how responses to our questions shifted from before to after the course.</p>
    <div id="questions-content" class="questions-content"></div>
  </section>

  <footer class="taskbar" aria-label="Archive navigation">
    <div class="taskbar-left">
      <button id="about-button" class="task-btn" type="button" aria-label="About">
        <span class="task-icon" aria-hidden="true">?</span><span class="task-name">About</span>
      </button>
      <button id="list-button" class="task-btn" type="button" aria-label="Project list">
        <span class="task-icon" aria-hidden="true">≡</span><span class="task-name">List</span>
      </button>
      <button id="questions-button" class="task-btn" type="button" aria-label="Class questions">
        <span class="task-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 4.5h14v10H9l-4 3v-3H3z"/>
            <path d="M7.5 8a2.5 2.5 0 1 1 4.2 1.8c-1 .9-1.7 1.1-1.7 2.2"/>
            <path d="M10 14.2h.01"/>
          </svg>
        </span><span class="task-name">Questions</span>
      </button>
      <button id="shuffle-button" class="task-btn" type="button" aria-label="Shuffle project layout">
        <span class="task-icon" aria-hidden="true">⇄</span><span class="task-name">Shuffle</span>
      </button>
    </div>
    <span class="taskbar-title">What Do We Do Now? — Class Archive</span>
  </footer>

  <script>
    (() => {
      const desktop = document.getElementById("desktop");
      const siteTitle = document.querySelector(".site-title");
      const shell = document.getElementById("window-shell");
      const panel = document.getElementById("window-panel");
      const titlebar = document.getElementById("titlebar");
      const title = document.getElementById("window-title");
      const viewport = document.getElementById("window-viewport");
      const backdrop = document.getElementById("overlay-backdrop");
      const closeButton = document.getElementById("close-window");
      const maximizeButton = document.getElementById("maximize-window");
      const nodes = [];
      let activeItem = null;
      let sortKey = "title";
      let sortAscending = true;
      let dragState = null;

      // Add or edit one object per outcome. `png` is the desktop-node image;
      // optional `screenshot` is the image shown in that project's description.
      // Both paths are relative to this page; omit screenshot to reuse png.
      // Set pngSize in pixels to resize an individual thumbnail; it defaults to 74.
      // Edit `projectName`, `participant`, and `progress` independently for each project.
      const items = [

      function getTitleBounds() {
        const titleRect = siteTitle.getBoundingClientRect();
        const desktopRect = desktop.getBoundingClientRect();
        const padding = 12;
        return {
          x: titleRect.left - desktopRect.left + desktop.scrollLeft - padding,
          y: titleRect.top - desktopRect.top + desktop.scrollTop - padding,
          width: titleRect.width + padding * 2,
          height: titleRect.height + padding * 2
        };
      }

      function overlaps(first, second) {
        return first.x < second.x + second.width &&
          first.x + first.width > second.x &&
          first.y < second.y + second.height &&
          first.y + first.height > second.y;
      }

      function setNodePosition(node, x, y) {
        const maxX = Math.max(0, desktop.scrollWidth - node.offsetWidth);
        const maxY = Math.max(0, desktop.scrollHeight - node.offsetHeight);
        const nextX = Math.max(0, Math.min(x, maxX));
        const nextY = Math.max(0, Math.min(y, maxY));
        if (overlaps({
          x: nextX,
          y: nextY,
          width: node.offsetWidth,
          height: node.offsetHeight
        }, getTitleBounds())) return false;
        node.style.left = `${nextX}px`;
        node.style.top = `${nextY}px`;
        node.dataset.x = String(nextX);
        node.dataset.y = String(nextY);
        return true;
      }

      function layoutNodes() {
        const width = desktop.clientWidth;
        const compact = window.matchMedia("(max-width: 560px)").matches;
        const baseNodeWidth = compact ? 112 : 138;
        const gap = 18;
        nodes.forEach((node, index) => {
          const item = items[index];
          const savedSize = localStorage.getItem(`project-image-size:${item.html}`);
          const configuredSize = savedSize === null ? item.pngSize : Number(savedSize);
          applyThumbnailSize(node, item, Number.isFinite(configuredSize) ? configuredSize : 74, false);
        });
        const nodeWidth = Math.max(...nodes.map(node => node.offsetWidth));
        const nodeHeight = Math.max(...nodes.map(node => node.offsetHeight));
        const columns = Math.max(1, Math.floor((width - 24) / (nodeWidth + gap)));
        const rows = Math.ceil(nodes.length / columns);
        desktop.style.minHeight = `${Math.max(desktop.clientHeight, rows * (nodeHeight + gap) + 60)}px`;
        const canvasHeight = desktop.scrollHeight;

        const indices = items.map((_, index) => index);
        for (let i = indices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [indices[i], indices[j]] = [indices[j], indices[i]];
        }

        const placed = [getTitleBounds()];
        const hasSpace = (x, y, node) => placed.every(position =>
          x + node.offsetWidth + 10 <= position.x ||
          position.x + position.width + 10 <= x ||
          y + node.offsetHeight + 10 <= position.y ||
          position.y + position.height + 10 <= y
        );

        indices.forEach((itemIndex, position) => {
          const node = nodes[itemIndex];
          const maxX = Math.max(0, width - node.offsetWidth - 8);
          const maxY = Math.max(38, canvasHeight - node.offsetHeight - 8);
          let point = null;

          for (let attempt = 0; attempt < 160; attempt++) {
            const x = Math.floor(Math.random() * (maxX + 1));
            const y = 38 + Math.floor(Math.random() * (maxY - 38 + 1));
            if (hasSpace(x, y, node)) {
              point = { x, y };
              break;
            }
          }

          if (!point) {
            for (let slot = 0; slot < nodes.length; slot++) {
              const x = 12 + (slot % columns) * (nodeWidth + gap);
              const y = 40 + Math.floor(slot / columns) * (nodeHeight + gap);
              if (hasSpace(x, y, node)) {
                point = { x, y };
                break;
              }
            }
          }

          if (point) {
            setNodePosition(node, point.x, point.y);
            placed.push({
              x: point.x,
              y: point.y,
              width: node.offsetWidth,
              height: node.offsetHeight
            });
          }
        });
      }

      function applyThumbnailSize(node, item, size, persist = true) {

        item.pngSize = pngSize;
        node.style.setProperty("--png-size", `${pngSize}px`);
        node.style.width = `${Math.max(
          window.matchMedia("(max-width: 560px)").matches ? 112 : 138,
          pngSize + 12
        )}px`;
        node.dataset.pngSize = String(pngSize);
        if (persist) localStorage.setItem(`project-image-size:${item.html}`, String(pngSize));
        return pngSize;
      }

          });
          question.after.forEach((position, responseIndex) => {
            const dot = makeDot(question.before[responseIndex] ?? position, responseIndex, "after");
            dot.style.opacity = "0";
            board.appendChild(dot);
            movingDots.push({ dot, before: question.before[responseIndex] ?? position, after: position });
          });
          const legend = document.createElement("div");
          legend.className = "barometer-legend";
          const legendItem = (colorClass, text) => {
            const item = document.createElement("span");
            item.className = "legend-item";
            const dot = document.createElement("span");
            dot.className = `legend-dot${colorClass ? ` ${colorClass}` : ""}`;
            dot.setAttribute("aria-hidden", "true");
            item.append(dot, document.createTextNode(text));
            return item;
          };
          legend.append(legendItem("", "Before"), legendItem("after", "After"));
          panelElement.append(panelTitle, board, legend);
          pair.appendChild(panelElement);
          const transition = document.createElement("label");

          const slider = document.createElement("input");
          slider.className = "transition-slider";

          slider.min = "0";
          slider.max = "100";
          slider.value = "0";
          slider.setAttribute("aria-label", `Transition responses for ${question.question} from before to after`);
          const afterLabel = document.createElement("span");
          afterLabel.textContent = "After";
          const reading = document.createElement("output");
          reading.className = "transition-reading";
          reading.textContent = "Before";
          slider.addEventListener("input", () => {
            const progress = Number(slider.value) / 100;
            movingDots.forEach(({ dot, before, after: afterPosition }, responseIndex) => {
              const position = before + (afterPosition - before) * progress;
              dot.style.left = `${37 + position * 0.26}%`;
              dot.style.opacity = String(progress);
              dot.title = `Response ${responseIndex + 1}: ${Math.round(position)}%`;
            });
            reading.textContent = progress === 0
              ? "Before"
              : progress === 1
                ? "After"
                : `${slider.value}%`;
          });
          transition.append(beforeLabel, slider, afterLabel, reading);
          card.append(heading, pair, transition);
          content.appendChild(card);
        });

        const session = document.createElement("span");
        session.textContent = item.session;
        details.append("Participant: ", participant, document.createElement("br"), "Session: ", session);
        const description = document.createElement("p");
        description.textContent = item.description;
        content.append(badge, projectTitle, details, description, projectLink);

        const screenshot = document.createElement("figure");
        screenshot.className = "description-screenshot";
        const image = document.createElement("img");
        const thumbnailPath = item.png || "./assets/thumbnails/yellow_rabbit.png";
        image.src = item.screenshot || thumbnailPath;
        image.alt = `Screenshot of ${item.title}`;
        image.addEventListener("error", () => {
          if (image.src !== new URL(thumbnailPath, window.location.href).href) {
            image.src = thumbnailPath;
          } else {
            screenshot.remove();
          }
        });
        screenshot.append(image);
        content.appendChild(screenshot);
        openWindow(`${item.title} — Description`, content, item);
      }

      function makeNode(item, index) {
        const node = document.createElement("button");
        node.type = "button";
        node.className = "desktop-node";
        node.dataset.index = String(index);
        node.dataset.pngSize = String(item.pngSize ?? 74);
        node.setAttribute("aria-label", `${item.title}, ${item.projectName || "Project name"}`);

        const image = document.createElement("img");
        image.src = item.png || "./assets/thumbnails/yellow_rabbit.png";
        image.alt = "";
        image.draggable = false;
        image.addEventListener("error", () => {
          image.src = "./assets/thumbnails/yellow_rabbit.png";
        }, { once: true });
        node.appendChild(image);

        const label = document.createElement("span");
        label.className = "node-label";
        label.textContent = item.title;
        const creator = document.createElement("span");
        creator.className = "node-creator";
        creator.textContent = item.projectName || "Project name";
        node.append(label, creator);

        node.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          node.setPointerCapture(event.pointerId);
          dragState = {
            node,
            pointerId: event.pointerId,
            startX: event.clientX,
            startY: event.clientY,
            originX: Number(node.dataset.x || 0),
            originY: Number(node.dataset.y || 0),
            moved: false
          };
        });

        node.addEventListener("pointermove", event => {
          if (!dragState || dragState.node !== node || dragState.pointerId !== event.pointerId) return;
          const deltaX = event.clientX - dragState.startX;
          const deltaY = event.clientY - dragState.startY;
          if (Math.abs(deltaX) + Math.abs(deltaY) > 5) dragState.moved = true;
          if (dragState.moved) setNodePosition(node, dragState.originX + deltaX, dragState.originY + deltaY);
        });

        node.addEventListener("pointerup", event => {
          if (!dragState || dragState.node !== node || dragState.pointerId !== event.pointerId) return;
          const didMove = dragState.moved;
          dragState = null;
          if (didMove) {
            node.dataset.dragged = "true";
            setTimeout(() => delete node.dataset.dragged, 0);
          }
        });

        node.addEventListener("click", event => {
          if (node.dataset.dragged === "true") {
            event.preventDefault();
            return;
          }
          nodes.forEach(other => other.classList.toggle("selected", other === node));
          showContextMenu(node, event);
        });

        node.addEventListener("contextmenu", event => {
          event.preventDefault();
          nodes.forEach(other => other.classList.toggle("selected", other === node));
          showContextMenu(node, event);
        });
        return node;
      }

      items.forEach((item, index) => {
        const node = makeNode(item, index);
        nodes.push(node);
        desktop.appendChild(node);
      });

      desktop.tabIndex = -1;
      layoutNodes();
      renderQuestions();
      window.addEventListener("resize", () => layoutNodes());

      document.getElementById("about-button").addEventListener("click", openAbout);
      document.getElementById("list-button").addEventListener("click", openList);
      document.getElementById("questions-button").addEventListener("click", () => {
        if (!shell.hidden) closeWindow();
        document.getElementById("questions-section").scrollIntoView({
          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
          block: "start"
        });
      });
      document.getElementById("shuffle-button").addEventListener("click", () => {
        closeContextMenu();
        layoutNodes();
      });
      closeButton.addEventListener("click", closeWindow);
      maximizeButton.addEventListener("click", () => {
        panel.classList.toggle("maximized");
        maximizeButton.setAttribute(
          "aria-label",
          panel.classList.contains("maximized") ? "Restore window" : "Maximize window"
        );
      });
      backdrop.addEventListener("click", closeWindow);
      document.addEventListener("click", event => {
        if (!event.target.closest(".context-menu") && !event.target.closest(".desktop-node")) {
          closeContextMenu();
        }
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          if (!shell.hidden) closeWindow();
          closeContextMenu();
        }
      });

      titlebar.addEventListener("pointerdown", event => {
        if (event.target.closest("button") || panel.classList.contains("maximized")) return;
        const rect = panel.getBoundingClientRect();
        dragState = {
          window: true,
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          originX: rect.left,
          originY: rect.top
        };
        panel.style.left = `${rect.left}px`;
        panel.style.top = `${rect.top}px`;
        panel.style.transform = "none";
        titlebar.setPointerCapture(event.pointerId);
      });

      titlebar.addEventListener("pointermove", event => {
        if (!dragState?.window || dragState.pointerId !== event.pointerId) return;
        const x = dragState.originX + event.clientX - dragState.startX;
        const y = dragState.originY + event.clientY - dragState.startY;
        const maxX = window.innerWidth - panel.offsetWidth;
        const maxY = window.innerHeight - panel.offsetHeight - 42;
        panel.style.left = `${Math.max(0, Math.min(x, maxX))}px`;
        panel.style.top = `${Math.max(0, Math.min(y, maxY))}px`;
      });

      titlebar.addEventListener("pointerup", event => {
        if (dragState?.window && dragState.pointerId === event.pointerId) dragState = null;
      });
    })();
  </script>
</body>
</html>
